version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./demo/backend
      dockerfile: Dockerfile
    container_name: tianhuifund-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret-key}
    volumes:
      # 持久化数据库文件
      - backend-data:/app/database
    networks:
      - tianhuifund-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务
  frontend:
    build:
      context: ./demo/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: tianhuifund-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - tianhuifund-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend-data:
    driver: local

networks:
  tianhuifund-network:
    driver: bridge
